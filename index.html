<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 카트 레이스 뽑기</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #13203f; color: #222; min-height: 100vh; padding: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font-family: inherit; }
  header { max-width: 1400px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #fff; }
  header h1 { margin: 0; font-size: 1.6rem; }
  .top-btns { display: flex; gap: 8px; }
  .ghost-btn { background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 12px; padding: 9px 14px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .ghost-btn:hover { background: rgba(255,255,255,.2); }

  .layout { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 14px 16px; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 10px; font-size: 1.1rem; }

  /* 경기장 */
  #stage { position: relative; background: #2e7d32; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  #stage canvas { display: block; margin: 0 auto; }
  #stage:fullscreen { border-radius: 0; display: flex; align-items: center; justify-content: center; background: #1f5e23; }
  #stage:-webkit-full-screen { border-radius: 0; display: flex; align-items: center; justify-content: center; background: #1f5e23; }
  .stage-btn { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(0,0,0,.45); color: #fff; border: none; border-radius: 10px; padding: 8px 12px; font-weight: bold; cursor: pointer; font-size: .95rem; }

  /* 결과 팝업 (경기장 안) */
  .result { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 5; }
  .result.show { display: flex; }
  .result-card { background: #fff; border-radius: 24px; padding: 26px 30px; min-width: 300px; max-width: 90%; text-align: center; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .result-card h3 { margin: 0 0 6px; font-size: 1.9rem; }
  .result-card .sub { color: #777; margin-bottom: 14px; }
  .winners { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .winner { background: #fff6d6; border: 3px solid #ffc53d; border-radius: 18px; padding: 12px 18px; font-size: 1.9rem; font-weight: bold; }
  .winner small { display: block; font-size: .95rem; color: #a07800; }
  .confetti { position: absolute; top: -40px; font-size: 1.8rem; pointer-events: none; z-index: 6; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(120vh) rotate(720deg); } }

  /* 참여 학생 */
  .roster { margin-top: 14px; }
  .roster-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .roster-head .hint { color: #888; font-size: .9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 2px solid #d5ddf3; background: #f5f8ff; border-radius: 999px; padding: 7px 13px; font-size: 1rem; font-weight: bold; cursor: pointer; user-select: none; }
  .chip .no { display: inline-block; min-width: 1.6em; text-align: center; border-radius: 999px; color: #fff; margin-right: 6px; padding: 0 5px; }
  .chip.absent { opacity: .4; text-decoration: line-through; background: #eee; }
  .chip.picked { background: #fff3c4; border-color: #ffc53d; }
  .chip.picked::after { content: " ⭐"; }

  /* 오른쪽 설정 */
  .side { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0; }
  .row label { font-weight: bold; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; border: none; background: #e8eeff; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
  .stepper span { min-width: 44px; text-align: center; font-size: 1.2rem; font-weight: bold; }
  select, input[type=text] { font-size: 1rem; padding: 7px 9px; border-radius: 10px; border: 2px solid #d5ddf3; }
  input[type=text] { width: 100%; }
  .switch { position: relative; width: 50px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccd3e6; border-radius: 999px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #4a7dff; }
  .switch input:checked + .slider::before { transform: translateX(22px); }

  .go-btn { width: 100%; font-size: 1.5rem; font-weight: bold; padding: 16px; border: none; border-radius: 16px; background: #ff5a36; color: #fff; cursor: pointer; box-shadow: 0 5px 0 #b8371b; }
  .go-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8371b; }
  .go-btn:disabled { background: #bbb; box-shadow: 0 5px 0 #999; cursor: default; }
  .info { color: #666; font-size: .92rem; margin-top: 8px; text-align: center; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .small-btn { flex: 1; padding: 10px 8px; border-radius: 12px; border: 2px solid #d5ddf3; background: #fff; font-weight: bold; cursor: pointer; font-size: .95rem; }
  .small-btn:hover { background: #f3f6ff; }

  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px dashed #e4e8f3; font-weight: bold; }
  .rank .pos { width: 28px; text-align: center; color: #888; }
  .rank .dot { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
  .rank .fin { margin-left: auto; }
  .log { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
  .log li { padding: 8px 4px; border-bottom: 1px dashed #e4e8f3; line-height: 1.5; }
  .log .meta { color: #999; font-size: .85rem; }
  .empty { color: #aaa; text-align: center; padding: 10px 0; }

  /* 명단 편집 창 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.show { display: flex; }
  .modal-card { background: #fff; border-radius: 20px; padding: 20px 22px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; }
  .modal-card h3 { margin: 0 0 8px; }
  .modal-card p { color: #666; margin: 6px 0; font-size: .95rem; line-height: 1.5; }
  textarea { width: 100%; height: 300px; font-size: 1.05rem; padding: 10px; border-radius: 12px; border: 2px solid #d5ddf3; line-height: 1.5; }
  .quick { display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; flex-wrap: wrap; }
  .quick input { width: 70px; font-size: 1rem; padding: 7px; border-radius: 10px; border: 2px solid #d5ddf3; }
  .primary { background: #4a7dff; color: #fff; border-color: #4a7dff; }
  .primary:hover { background: #3b6be8; }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🏎️ 우리반 카트 레이스 뽑기</h1>
  <div class="top-btns">
    <button class="ghost-btn" id="soundBtn">🔊 소리</button>
    <button class="ghost-btn" id="editBtn">✏️ 명단 편집</button>
  </div>
</header>

<div class="layout">
  <main>
    <div id="stage">
      <button class="stage-btn" id="fsBtn">📺 TV 크게 보기</button>
      <canvas id="track"></canvas>
      <div class="result" id="result">
        <div class="result-card">
          <h3>🏁 결승선 통과!</h3>
          <div class="sub" id="resultSub"></div>
          <div class="winners" id="winners"></div>
          <button class="go-btn" id="resultOk" style="font-size:1.2rem;padding:12px">확인</button>
        </div>
      </div>
    </div>

    <div class="card roster">
      <div class="roster-head">
        <h2>👥 참여 학생 <span id="countInfo" style="color:#4a7dff"></span></h2>
        <span class="hint">이름을 누르면 결석(빠짐) ↔ 참여로 바뀌어요 · ⭐ = 이미 뽑힘</span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </main>

  <aside class="side">
    <div class="card">
      <h2>⚙️ 레이스 설정</h2>
      <div class="row">
        <label>뽑을 인원</label>
        <div class="stepper">
          <button id="pickMinus">−</button><span id="pickVal">1명</span><button id="pickPlus">+</button>
        </div>
      </div>
      <div class="row">
        <label>바퀴 수</label>
        <select id="laps">
          <option value="1">1바퀴 (짧게)</option>
          <option value="2">2바퀴</option>
          <option value="3">3바퀴 (길게)</option>
        </select>
      </div>
      <div class="row">
        <label>진행 속도</label>
        <select id="speed">
          <option value="0.7">천천히</option>
          <option value="1">보통</option>
          <option value="1.6">빠르게</option>
          <option value="2.6">아주 빠르게</option>
        </select>
      </div>
      <div class="row">
        <label for="exclude">뽑힌 학생 제외</label>
        <label class="switch"><input type="checkbox" id="exclude"><span class="slider"></span></label>
      </div>
      <div class="row">
        <label for="hide">이름 가리기 (번호만)</label>
        <label class="switch"><input type="checkbox" id="hide"><span class="slider"></span></label>
      </div>
      <div class="row" style="display:block">
        <label>기록 제목 <span style="color:#aaa;font-weight:normal">(선택)</span></label>
        <input type="text" id="title" placeholder="예: 오늘의 발표자, 급식 당번" style="margin-top:6px">
      </div>
      <button class="go-btn" id="goBtn">🏁 카트 출발!</button>
      <div class="info" id="goInfo"></div>
      <div class="btn-row">
        <button class="small-btn" id="resetPicked">🔄 모두 다시 참여</button>
        <button class="small-btn" id="resetAbsent">🙋 결석 해제</button>
      </div>
    </div>

    <div class="card">
      <h2>📊 실시간 순위</h2>
      <ul class="rank" id="rank"><li class="empty" style="border:none;justify-content:center">출발을 기다리는 중…</li></ul>
    </div>

    <div class="card">
      <h2>📝 추첨 기록</h2>
      <ul class="log" id="log"></ul>
      <div class="btn-row"><button class="small-btn" id="clearLog">🗑️ 기록 지우기</button></div>
    </div>
  </aside>
</div>

<!-- 명단 편집 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h3>✏️ 우리반 명단</h3>
    <p>한 줄에 한 명씩 <b>번호 이름</b>으로 적어 주세요. 이름 없이 번호만 써도 돼요.<br>
       명단은 <b>이 기기의 브라우저에만</b> 저장되고 인터넷에 올라가지 않아요.</p>
    <div class="quick">
      <span>번호로만 빠르게:</span>
      <input type="number" id="quickN" min="1" max="40" value="25"> 명
      <button class="small-btn" id="quickFill" style="flex:0 0 auto">채우기</button>
    </div>
    <textarea id="rosterText" placeholder="1 김하늘&#10;2 이바다&#10;3 박구름&#10;…"></textarea>
    <div class="btn-row">
      <button class="small-btn" id="cancelEdit">취소</button>
      <button class="small-btn primary" id="saveEdit">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   저장 (이 기기 브라우저에만)
   ========================================================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const MAX_STUDENTS = 40;
let roster   = store.get("kr-roster", null) || Array.from({ length: 25 }, (_, i) => ({ no: i + 1, name: "" }));
let absent   = new Set(store.get("kr-absent", []));
let picked   = new Set(store.get("kr-picked", []));
let log      = store.get("kr-log", []);
let settings = Object.assign({ pick: 1, laps: 2, speed: 1, exclude: true, hide: false, title: "" }, store.get("kr-settings", {}));
function saveAll() {
  store.set("kr-roster", roster);
  store.set("kr-absent", [...absent]);
  store.set("kr-picked", [...picked]);
  store.set("kr-log", log);
  store.set("kr-settings", settings);
}

function label(st) { return settings.hide || !st.name ? `${st.no}번` : st.name; }
function kartColor(no) { return `hsl(${(no * 47) % 360}, 78%, 50%)`; }
function racers() { return roster.filter(s => !absent.has(s.no) && !(settings.exclude && picked.has(s.no))); }

/* =========================================================
   소리
   ========================================================= */
let audioCtx = null, soundOn = true;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function tone(f1, f2, dur, type = "triangle", when = 0, vol = .15) {
  if (!soundOn || !audioCtx) return;
  try {
    const t = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const SFX = {
  count() { tone(523, 523, .25, "square", 0, .1); },
  go()    { tone(1046, 1046, .6, "square", 0, .12); },
  boost() { tone(300, 1100, .35, "sawtooth", 0, .05); },
  spin()  { tone(900, 180, .45, "triangle", 0, .08); },
  finish(){ tone(880, 1320, .25, "triangle", 0, .12); },
  win()   { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, f, .24, "triangle", i * .13, .14)); },
};

/* =========================================================
   서킷 (경기장 모양)
   ========================================================= */
const VW = 1000, VH = 560;          // 그림의 기준 크기
const CX = 500, CY = 280;
const S = 440, R = 190, W = 150;    // 직선 길이, 곡선 반지름, 도로 폭
const L = 2 * S + 2 * Math.PI * R;  // 한 바퀴 길이
const START = S * 0.75;             // 출발선 위치(위쪽 직선)
const GRID_GAP = 38;

function posAt(s, off) {
  s = ((s % L) + L) % L;
  let x, y, h;
  if (s < S) { x = CX - S / 2 + s; y = CY - R; h = 0; }
  else if (s < S + Math.PI * R) { const a = -Math.PI / 2 + (s - S) / R; x = CX + S / 2 + R * Math.cos(a); y = CY + R * Math.sin(a); h = a + Math.PI / 2; }
  else if (s < 2 * S + Math.PI * R) { x = CX + S / 2 - (s - S - Math.PI * R); y = CY + R; h = Math.PI; }
  else { const a = Math.PI / 2 + (s - 2 * S - Math.PI * R) / R; x = CX - S / 2 + R * Math.cos(a); y = CY + R * Math.sin(a); h = a + Math.PI / 2; }
  return { x: x + Math.sin(h) * off, y: y - Math.cos(h) * off, h };
}

const stage = document.getElementById("stage");
const canvas = document.getElementById("track");
const ctx = canvas.getContext("2d");

function isFS() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function fitCanvas() {
  const w = stage.clientWidth;
  const h = isFS() ? stage.clientHeight : w * VH / VW;
  const scale = Math.min(w / VW, h / VH);
  const cw = Math.floor(VW * scale), ch = Math.floor(VH * scale);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const k = canvas.width / VW;
  ctx.setTransform(k, 0, 0, k, 0, 0);
}
window.addEventListener("resize", fitCanvas);
document.addEventListener("fullscreenchange", () => setTimeout(fitCanvas, 50));
document.addEventListener("webkitfullscreenchange", () => setTimeout(fitCanvas, 50));

function stadiumPath() {
  ctx.beginPath();
  ctx.moveTo(CX - S / 2, CY - R);
  ctx.lineTo(CX + S / 2, CY - R);
  ctx.arc(CX + S / 2, CY, R, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(CX - S / 2, CY + R);
  ctx.arc(CX - S / 2, CY, R, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawTrack() {
  // 잔디
  for (let i = 0; i < VW / 50; i++) { ctx.fillStyle = i % 2 ? "#3f9a45" : "#46a54c"; ctx.fillRect(i * 50, 0, 50, VH); }
  // 연석 → 도로
  stadiumPath(); ctx.lineWidth = W + 18; ctx.strokeStyle = "#e53935"; ctx.setLineDash([]); ctx.stroke();
  ctx.lineWidth = W + 18; ctx.strokeStyle = "#fff"; ctx.setLineDash([18, 18]); ctx.stroke();
  ctx.setLineDash([]); ctx.lineWidth = W; ctx.strokeStyle = "#4a4f5a"; ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.setLineDash([22, 22]); ctx.stroke();
  ctx.setLineDash([]);
  // 안쪽 잔디
  ctx.fillStyle = "#57b55d";
  rr(CX - S / 2 - (R - W / 2 - 6), CY - (R - W / 2 - 6), S + 2 * (R - W / 2 - 6), 2 * (R - W / 2 - 6), R - W / 2 - 6);
  ctx.fill();
  // 출발선(체크무늬)
  const sx = CX - S / 2 + START, top = CY - R - W / 2;
  for (let i = 0; i < W / 10; i++) for (let j = 0; j < 2; j++) {
    ctx.fillStyle = (i + j) % 2 ? "#111" : "#fff";
    ctx.fillRect(sx - 10 + j * 10, top + i * 10, 10, 10);
  }
}

/* =========================================================
   레이스
   ========================================================= */
let race = null;
let lastRankUpdate = 0;
const rand = (a, b) => a + Math.random() * (b - a);

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startRace() {
  if (race && race.phase !== "done") return;
  const list = racers();
  if (!list.length) { updateGoInfo(); return; }
  unlockAudio();
  hideResult();
  const lanes = Math.min(6, list.length);
  // 출발 자리는 매번 무작위로 섞어요 (모두에게 공평)
  const karts = shuffle(list).map((st, i) => {
    const col = i % lanes, row = Math.floor(i / lanes);
    const off = lanes === 1 ? 0 : -W / 2 + 16 + col * (W - 32) / (lanes - 1);
    return { st, d: -row * GRID_GAP, off, offTarget: off, v: 1, target: 1, next: 0,
             boost: 0, spin: 0, spinA: 0, finished: false, place: 0, color: kartColor(st.no) };
  });
  race = {
    karts, finish: [], t: 0, phase: "countdown", cd: 3.999, lastCd: 4,
    pick: Math.min(settings.pick, list.length), laps: settings.laps, speed: settings.speed,
    total: settings.laps * L, msgs: [], lastMsg: -9, endAt: 0, title: settings.title.trim(),
  };
  document.getElementById("goBtn").disabled = true;
  lockSettings(true);
}

function addMsg(text) {
  if (race.t - race.lastMsg < .6) return;
  race.lastMsg = race.t;
  race.msgs.push({ text, life: 2.2 });
  if (race.msgs.length > 3) race.msgs.shift();
}

function update(dt) {
  if (!race) return;
  race.msgs.forEach(m => m.life -= dt);
  race.msgs = race.msgs.filter(m => m.life > 0);

  if (race.phase === "countdown") {
    race.cd -= dt;
    const n = Math.ceil(race.cd);
    if (n !== race.lastCd) { race.lastCd = n; if (n > 0) SFX.count(); else SFX.go(); }
    if (race.cd <= 0) { race.phase = "running"; race.goFlash = .8; }
    return;
  }
  if (race.phase === "done") return;
  if (race.goFlash > 0) race.goFlash -= dt;

  race.t += dt;
  const base = 230 * race.speed;
  for (const k of race.karts) {
    if (race.t >= k.next) {
      k.target = rand(.86, 1.14);
      k.next = race.t + rand(.5, 1.5);
      k.offTarget = Math.max(-W / 2 + 16, Math.min(W / 2 - 16, k.off + rand(-25, 25)));
    }
    k.v += (k.target - k.v) * Math.min(1, dt * 2);
    k.off += (k.offTarget - k.off) * Math.min(1, dt * 1.5);
    let m = k.v;
    if (k.boost > 0) { m *= 1.7; k.boost -= dt; }
    if (k.spin > 0)  { m *= .15; k.spin -= dt; k.spinA += dt * 14; } else k.spinA = 0;

    // 깜짝 이벤트 (모든 카트에게 같은 확률)
    if (!k.finished && k.d > 0 && k.boost <= 0 && k.spin <= 0 && Math.random() < dt * .07) {
      if (Math.random() < .55) { k.boost = rand(.8, 1.3); SFX.boost(); addMsg(`🔥 ${label(k.st)} 부스터 발동!`); }
      else { k.spin = rand(.6, 1); SFX.spin(); addMsg(`💫 ${label(k.st)} 미끄러졌어요!`); }
    }
    k.d += base * (k.finished ? .6 : m) * dt;

    if (!k.finished && k.d >= race.total) {
      k.finished = true;
      race.finish.push(k);
      k.place = race.finish.length;
      if (k.place <= race.pick) { SFX.finish(); addMsg(`🏁 ${k.place}등 ${label(k.st)}!`); }
    }
  }
  if (race.phase === "running" && race.finish.length >= race.pick) {
    race.phase = "finishing"; race.endAt = race.t + 1.3;
  }
  if (race.phase === "finishing" && race.t >= race.endAt) endRace();
}

function endRace() {
  race.phase = "done";
  const winners = race.finish.slice(0, race.pick).map(k => k.st);
  winners.forEach(st => picked.add(st.no));
  log.unshift({
    round: (log[0] ? log[0].round : 0) + 1,
    title: race.title, time: new Date().toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }),
    winners: winners.map(s => ({ no: s.no, name: s.name })),
  });
  saveAll();
  showResult(winners);
  document.getElementById("goBtn").disabled = false;
  lockSettings(false);
  renderChips(); renderLog(); updateGoInfo();
}

/* =========================================================
   그리기
   ========================================================= */
function drawKart(k) {
  const s = START + k.d;
  const p = posAt(s, k.off);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.h + k.spinA);
  if (k.boost > 0) {
    ctx.fillStyle = Math.random() < .5 ? "#ffb300" : "#ff6d00";
    ctx.beginPath(); ctx.moveTo(-15, -6); ctx.lineTo(-30 - Math.random() * 10, 0); ctx.lineTo(-15, 6); ctx.fill();
  }
  ctx.fillStyle = "rgba(0,0,0,.25)"; rr(-14, -7, 32, 20, 6); ctx.fill();
  ctx.fillStyle = "#1b1b1b";
  ctx.fillRect(-12, -12, 8, 5); ctx.fillRect(5, -12, 8, 5); ctx.fillRect(-12, 7, 8, 5); ctx.fillRect(5, 7, 8, 5);
  ctx.fillStyle = k.color; rr(-16, -9, 32, 18, 6); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; rr(6, -6, 9, 12, 3); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-3, 0, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (k.place && k.place <= race.pick) {
    ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 4; ctx.strokeStyle = "#111"; ctx.strokeText(k.st.no, p.x, p.y - 19);
  ctx.fillStyle = "#fff"; ctx.fillText(k.st.no, p.x, p.y - 19);
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);
  drawTrack();

  // 가운데 글씨
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.font = "bold 34px sans-serif";
  ctx.fillText(race && race.title ? race.title : (settings.title.trim() || "🏁 우리반 그랑프리"), CX, CY - 55);

  if (race) {
    const leader = Math.max(...race.karts.map(k => k.d));
    const lap = Math.min(race.laps, Math.max(1, Math.floor(leader / L) + 1));
    ctx.font = "bold 22px sans-serif"; ctx.fillStyle = "#fff59d";
    ctx.fillText(race.phase === "countdown" ? `${race.karts.length}대 출발 준비` : `LAP ${lap} / ${race.laps} · ${race.pick}명 뽑기`, CX, CY - 15);

    race.msgs.forEach((m, i) => {
      ctx.globalAlpha = Math.min(1, m.life);
      ctx.font = "bold 22px sans-serif"; ctx.fillStyle = "#fff";
      ctx.fillText(m.text, CX, CY + 25 + i * 30);
    });
    ctx.globalAlpha = 1;

    [...race.karts].sort((a, b) => posAt(START + a.d, a.off).y - posAt(START + b.d, b.off).y).forEach(drawKart);

    if (race.phase === "countdown" || race.goFlash > 0) {
      const txt = race.phase === "countdown" ? String(Math.ceil(race.cd)) : "출발!";
      ctx.font = "bold 120px sans-serif";
      ctx.lineWidth = 10; ctx.strokeStyle = "#111"; ctx.strokeText(txt, CX, CY + 10);
      ctx.fillStyle = race.phase === "countdown" ? "#ffd54a" : "#7CFC6B"; ctx.fillText(txt, CX, CY + 10);
    }
  } else {
    ctx.font = "bold 22px sans-serif"; ctx.fillStyle = "#fff59d";
    ctx.fillText("오른쪽의 🏁 카트 출발! 버튼을 눌러 주세요", CX, CY - 5);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  if (race && now - lastRankUpdate > 250) { lastRankUpdate = now; renderRank(); }
  requestAnimationFrame(loop);
}

/* =========================================================
   화면 표시
   ========================================================= */
function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = roster.map(st => {
    const cls = ["chip"];
    if (absent.has(st.no)) cls.push("absent");
    if (picked.has(st.no)) cls.push("picked");
    const nm = settings.hide || !st.name ? "" : st.name;
    return `<span class="${cls.join(" ")}" data-no="${st.no}"><span class="no" style="background:${kartColor(st.no)}">${st.no}</span>${nm || "번"}</span>`;
  }).join("");
  const n = racers().length;
  document.getElementById("countInfo").textContent = `(출전 ${n}명 / 전체 ${roster.length}명)`;
}
document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (race && race.phase !== "done") return;
  const no = Number(c.dataset.no);
  absent.has(no) ? absent.delete(no) : absent.add(no);
  saveAll(); renderChips(); updateGoInfo();
});

function renderRank() {
  const ul = document.getElementById("rank");
  if (!race) return;
  const order = [...race.karts].sort((a, b) => (a.finished && b.finished) ? a.place - b.place : (a.finished ? -1 : b.finished ? 1 : b.d - a.d));
  ul.innerHTML = order.slice(0, 8).map((k, i) => `
    <li><span class="pos">${i + 1}</span><span class="dot" style="background:${k.color}"></span>
    ${k.st.no}번${settings.hide || !k.st.name ? "" : " " + k.st.name}
    <span class="fin">${k.finished ? (k.place <= race.pick ? "🏁⭐" : "🏁") : ""}</span></li>`).join("");
}

function renderLog() {
  const ul = document.getElementById("log");
  if (!log.length) { ul.innerHTML = `<li class="empty">아직 기록이 없어요</li>`; return; }
  ul.innerHTML = log.map(r => `
    <li><b>${r.round}회</b>${r.title ? " · " + escapeHtml(r.title) : ""}<br>
    ${r.winners.map(w => "⭐ " + label(w)).join(", ")}
    <div class="meta">${r.time}</div></li>`).join("");
}
function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function updateGoInfo() {
  const n = racers().length;
  const info = document.getElementById("goInfo");
  const btn = document.getElementById("goBtn");
  if (!n) {
    info.innerHTML = "모두 뽑혔어요! <b>🔄 모두 다시 참여</b>를 눌러 주세요";
    btn.disabled = true;
  } else {
    info.textContent = `${n}명이 달리고, ${Math.min(settings.pick, n)}명을 뽑아요`;
    btn.disabled = !!(race && race.phase !== "done");
  }
}

function showResult(winners) {
  const medals = ["🥇", "🥈", "🥉"];
  document.getElementById("resultSub").textContent = race.title || `${race.karts.length}명 중 ${winners.length}명 당첨`;
  document.getElementById("winners").innerHTML = winners.map((st, i) =>
    `<div class="winner">${medals[i] || "⭐"} ${escapeHtml(label(st))}<small>${i + 1}등 · ${st.no}번</small></div>`).join("");
  document.getElementById("result").classList.add("show");
  SFX.win(); confetti();
}
function hideResult() { document.getElementById("result").classList.remove("show"); }
document.getElementById("resultOk").onclick = hideResult;

function confetti() {
  const items = ["🎉", "⭐", "🏁", "✨", "🎊", "🏆"];
  for (let i = 0; i < 50; i++) {
    const s = document.createElement("span");
    s.className = "confetti"; s.textContent = items[i % items.length];
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDuration = 2.5 + Math.random() * 2 + "s";
    s.style.animationDelay = Math.random() * 1 + "s";
    stage.appendChild(s);
    setTimeout(() => s.remove(), 6000);
  }
}

/* =========================================================
   설정 · 버튼
   ========================================================= */
const $ = id => document.getElementById(id);
function syncSettingsUI() {
  $("pickVal").textContent = settings.pick + "명";
  $("laps").value = String(settings.laps);
  $("speed").value = String(settings.speed);
  $("exclude").checked = settings.exclude;
  $("hide").checked = settings.hide;
  $("title").value = settings.title;
}
function lockSettings(on) {
  ["pickMinus", "pickPlus", "laps", "speed", "exclude", "resetPicked", "resetAbsent", "editBtn"].forEach(id => $(id).disabled = on);
}
$("pickMinus").onclick = () => { settings.pick = Math.max(1, settings.pick - 1); syncSettingsUI(); saveAll(); updateGoInfo(); };
$("pickPlus").onclick  = () => { settings.pick = Math.min(10, settings.pick + 1); syncSettingsUI(); saveAll(); updateGoInfo(); };
$("laps").onchange  = e => { settings.laps = Number(e.target.value); saveAll(); };
$("speed").onchange = e => { settings.speed = Number(e.target.value); saveAll(); };
$("exclude").onchange = e => { settings.exclude = e.target.checked; saveAll(); renderChips(); updateGoInfo(); };
$("hide").onchange = e => { settings.hide = e.target.checked; saveAll(); renderChips(); renderLog(); if (race) renderRank(); };
$("title").oninput = e => { settings.title = e.target.value; saveAll(); };
$("goBtn").onclick = startRace;
$("resetPicked").onclick = () => {
  if (!picked.size || confirm("뽑힌 학생을 모두 다시 참여시킬까요?")) { picked.clear(); saveAll(); renderChips(); updateGoInfo(); }
};
$("resetAbsent").onclick = () => { absent.clear(); saveAll(); renderChips(); updateGoInfo(); };
$("clearLog").onclick = () => { if (log.length && confirm("추첨 기록을 모두 지울까요?")) { log = []; saveAll(); renderLog(); } };
$("soundBtn").onclick = e => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? "🔊 소리" : "🔇 소리"; if (soundOn) unlockAudio(); };

$("fsBtn").onclick = () => {
  try {
    if (isFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const p = (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
};
if (!(stage.requestFullscreen || stage.webkitRequestFullscreen)) $("fsBtn").style.display = "none";

document.addEventListener("keydown", e => {
  if ($("modal").classList.contains("show")) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if ($("result").classList.contains("show")) hideResult();
    else if (!$("goBtn").disabled) startRace();
  }
});

/* 명단 편집 */
function openEdit() {
  $("rosterText").value = roster.map(s => s.name ? `${s.no} ${s.name}` : `${s.no}`).join("\n");
  $("modal").classList.add("show");
}
function parseRoster(text) {
  const out = []; const used = new Set(); let prev = 0;
  text.split("\n").map(l => l.trim()).filter(Boolean).forEach(line => {
    const m = line.match(/^(\d+)\s*(?:번)?[\s.)\-:]*(.*)$/);
    let no, name;
    if (m) { no = Number(m[1]); name = m[2].trim(); } else { no = prev + 1; name = line; }
    while (used.has(no)) no++;
    used.add(no); prev = no;
    out.push({ no, name: name.slice(0, 12) });
  });
  return out.slice(0, MAX_STUDENTS);
}
$("editBtn").onclick = openEdit;
$("cancelEdit").onclick = () => $("modal").classList.remove("show");
$("quickFill").onclick = () => {
  const n = Math.max(1, Math.min(MAX_STUDENTS, Number($("quickN").value) || 25));
  $("rosterText").value = Array.from({ length: n }, (_, i) => String(i + 1)).join("\n");
};
$("saveEdit").onclick = () => {
  const list = parseRoster($("rosterText").value);
  if (!list.length) { alert("학생을 한 명 이상 적어 주세요."); return; }
  roster = list;
  const nos = new Set(roster.map(s => s.no));
  absent = new Set([...absent].filter(n => nos.has(n)));
  picked = new Set([...picked].filter(n => nos.has(n)));
  saveAll(); renderChips(); renderLog(); updateGoInfo();
  $("modal").classList.remove("show");
};

/* 처음 실행 */
syncSettingsUI(); renderChips(); renderLog(); updateGoInfo();
fitCanvas();
requestAnimationFrame(loop);
</script>
